name: Check Markdown prose
description: Run Proselint on every tracked Markdown file

runs:
  using: composite
  steps:
    - name: Install Proselint
      shell: bash
      run: python -m pip install proselint==0.16.0

    - name: Find and check Markdown files
      shell: bash
      run: |
        mapfile -d '' markdown_files < <(git ls-files -z -- '*.md')

        if [ "${#markdown_files[@]}" -eq 0 ]; then
          echo "No Markdown files found."
          exit 0
        fi

        echo "Checking ${#markdown_files[@]} Markdown files..."
        proselint check --config "$GITHUB_WORKSPACE/proselint.json" "${markdown_files[@]}"
